<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icone.png" />
    <link rel="apple-touch-icon" href="/icone.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jackarlo's" />
    <!-- Google Fonts: preconnect evita bloqueio de render em redes lentas -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <title>Jackarlo's</title>
    <!-- Skeleton: APENAS #app-loading - não interfere com o layout do app -->
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #app-loading.fade-out { opacity: 0; pointer-events: none; }
      #app-loading .loader-logo {
        width: 88px;
        height: 88px;
        border-radius: 18px;
        background: #e2e8f0;
        margin-bottom: 20px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading .loader-logo img { width: 100%; height: 100%; object-fit: contain; }
      #app-loading .loader-spinner {
        width: 26px;
        height: 26px;
        border: 2.5px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: loader-spin 0.75s linear infinite;
      }
      #app-loading .loader-text {
        margin-top: 10px;
        font-size: 13px;
        color: #94a3b8;
        font-family: system-ui, sans-serif;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Loading visual imediato — sem esperar o JS -->
    <div id="app-loading">
      <div class="loader-logo">
        <img src="/logojt.webp" onerror="this.src='/logojt.PNG'" alt="Logo" width="88" height="88" />
      </div>
      <div class="loader-spinner"></div>
      <p class="loader-text">Carregando...</p>
    </div>

    <div id="root"></div>

    <script>
      // Remove o skeleton quando o React montar
      window.__removeLoader = function() {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 300);
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
